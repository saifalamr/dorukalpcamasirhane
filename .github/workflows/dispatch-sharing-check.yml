name: Dispatch sharing checks

on:
  push:
    branches: [main, fix/dispatch-whatsapp-file]
    paths:
      - src/components/DispatchActions.tsx
      - tests/dispatch-sharing.test.cjs
      - tests/dispatch-sharing.browser.cjs
      - .github/workflows/dispatch-sharing-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Dispatch sharing regression tests
        run: node --test tests/dispatch-sharing.test.cjs
      - name: Production build (isolated placeholder configuration)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dispatch-build-placeholder
      - name: Install isolated browser test tools
        run: npm install --no-save --package-lock=false playwright@1.56.1 esbuild@0.25.10
      - name: Install browser engines
        run: npx playwright install --with-deps webkit chromium
      - name: Compile existing styles for browser fixtures
        run: npx tailwindcss -i src/app/globals.css -o /tmp/dispatch-test.css
      - name: Browser PDF byte equality and fallback checks
        run: node tests/dispatch-sharing.browser.cjs
      - name: Save synthetic PDF evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dispatch-sharing-evidence
          path: test-output/dispatch-sharing
          if-no-files-found: ignore
