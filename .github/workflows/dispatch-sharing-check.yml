name: Dispatch sharing checks

on:
  push:
    branches: [main, fix/dispatch-whatsapp-file]
    paths:
      - src/components/DispatchActions.tsx
      - tests/dispatch-sharing.test.cjs
      - .github/workflows/dispatch-sharing-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Dispatch sharing regression tests
        run: node --test tests/dispatch-sharing.test.cjs
      - name: Production build (isolated placeholder configuration)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dispatch-build-placeholder
